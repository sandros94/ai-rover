minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nuxt'
  - 'nuxt-nightly'
  - '@nuxt/*'

# `unauth`'s pkg.pr.new build depends on `unjwt` by URL; allowed until both are released on npm.
blockExoticSubdeps: false

packageExtensions:
  # `@tresjs/nuxt` imports `@nuxt/devtools-kit` at runtime without declaring it.
  '@tresjs/nuxt':
    dependencies:
      '@nuxt/devtools-kit': ^4.0.0

allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false

patchedDependencies:
  '@nuxt/fonts': .patches/@nuxt__fonts.patch
