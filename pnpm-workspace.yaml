minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nuxt'
  - 'nuxt-nightly'
  - '@nuxt/*'

overrides:
  # Netlify Database runs PostgreSQL 18; `@netlify/database-dev` pins an older PGlite major.
  '@electric-sql/pglite': '0.5.13'
allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false

patchedDependencies:
  '@netlify/database-dev': .patches/@netlify__database-dev.patch
  '@nuxt/fonts': .patches/@nuxt__fonts.patch
