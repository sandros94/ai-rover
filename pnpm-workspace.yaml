minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nuxt'
  - 'nuxt-nightly'
  - '@nuxt/*'

# @nuxt/test-utils-nightly ships with an unreplaced `workspace:*` dep — pin the
# published environment package until the nightly publish pipeline is fixed.
overrides:
  # The 2026-09-28 CLI nightly imports a dev-only module in the server runtime and answers 500 on every dev page.
  '@nuxt/cli': 'npm:@nuxt/cli-nightly@4.0.0-20260926-151446-e125c98'
  'vitest-environment-nuxt': ^2.0.0
  # Netlify Database runs PostgreSQL 18; `@netlify/database-dev` pins an older PGlite major.
  '@electric-sql/pglite': '0.5.8'
allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false

patchedDependencies:
  '@netlify/database-dev': .patches/@netlify__database-dev.patch
  '@nuxt/fonts': .patches/@nuxt__fonts.patch
  '@nuxt/test-utils-nightly': .patches/@nuxt__test-utils-nightly.patch
