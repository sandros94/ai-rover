minimumReleaseAgeStrict: true

minimumReleaseAgeExclude:
  - 'nuxt'
  - 'nuxt-nightly'
  - '@nuxt/*'

allowBuilds:
  '@parcel/watcher': false
  'better-sqlite3': true
  cpu-features: false
  esbuild: false
  protobufjs: false
  'sharp@0.34.5': true
  simple-git-hooks: true
  ssh2: false
  vue-demi: false

patchedDependencies:
  '@nuxt/fonts': .patches/@nuxt__fonts.patch
