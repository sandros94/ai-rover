<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Perseverance's wheel face on: tread, six radial spokes each bent square into a flexure, hub. -->
  <style>
    .wheel { color: #ea580c; }
    @media (prefers-color-scheme: dark) { .wheel { color: #fb923c; } }
  </style>
  <g class="wheel" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="miter">
    <circle cx="16" cy="16" r="13.8" stroke-width="2.2"/>
    <g stroke-width="1.9">
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11"/>
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11" transform="rotate(60 16 16)"/>
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11" transform="rotate(120 16 16)"/>
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11" transform="rotate(180 16 16)"/>
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11" transform="rotate(240 16 16)"/>
      <path d="M16 11.8V5.7A10.3 10.3 0 0 1 22.62 8.11" transform="rotate(300 16 16)"/>
    </g>
    <circle cx="16" cy="16" r="4.8" fill="currentColor" stroke="none"/>
  </g>
</svg>
