name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Lint
        run: pnpm lint

      - name: Typecheck code
        run: pnpm typecheck

      # The platform applies migrations in name order and refuses one that sorts before an applied
      # one, so a branch's new migrations must sort after everything already on the base branch.
      - name: Migrations sort after the base branch's
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          base=$(git ls-tree --name-only "origin/${{ github.base_ref }}" netlify/database/migrations/ | xargs -n1 basename | sort | tail -n1)
          new=$(comm -13 <(git ls-tree --name-only "origin/${{ github.base_ref }}" netlify/database/migrations/ | xargs -n1 basename | sort) <(ls netlify/database/migrations | sort))
          for m in $new; do
            if [[ "$m" < "$base" ]]; then echo "::error::migration $m sorts before $base, which is already on ${{ github.base_ref }}"; exit 1; fi
          done
          echo "new migrations: ${new:-none}; latest on base: $base"

      # The platform bundles `netlify/functions` itself, outside Nitro; importing the zipped result
      # proves every import and alias of the background function resolved.
      - name: Build the Netlify functions and import the background one
        run: |
          pnpm --package=netlify-cli@27 dlx netlify build --offline
          node --input-type=module -e "
          import { execFileSync } from 'node:child_process'
          import { mkdtempSync } from 'node:fs'
          import { tmpdir } from 'node:os'
          import { join } from 'node:path'
          import { pathToFileURL } from 'node:url'
          const dir = mkdtempSync(join(tmpdir(), 'mission-tick-'))
          execFileSync('unzip', ['-q', '.netlify/functions/mission-tick-background.zip', '-d', dir])
          const entry = join(dir, 'netlify/functions/mission-tick-background.mjs')
          const fn = await import(pathToFileURL(entry).href)
          if (typeof fn.default !== 'function') throw new Error('mission-tick-background exports no handler')
          console.log('mission-tick-background imports from its zip')
          "

  test:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [unit, nuxt, e2e]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Install Playwright browser
        if: matrix.project == 'e2e' || matrix.project == 'browser'
        run: pnpm exec playwright install --with-deps chromium

      - name: Test ${{ matrix.project }}
        id: test
        env:
          # A built server refuses to start without a session key; this one only ever seals CI sessions.
          NUXT_SESSION_KEY: ci-only-session-secret-0123456789abcdefghijklmnopqrstuvwxyz
        run: |
          set -o pipefail
          pnpm test:${{ matrix.project }} 2>&1 | tee "/tmp/test-${{ matrix.project }}.log"

      - name: Test summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### ${{ matrix.project }} — ${{ steps.test.outcome == 'success' && '✅ passed' || '❌ failed' }}"
            echo '```'
            tail -n 30 "/tmp/test-${{ matrix.project }}.log" | sed -E 's/\x1b\[[0-9;]*m//g'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
